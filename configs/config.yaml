# RL-ML Inventory Optimization — central configuration

project:
  name: rl-ml-inventory-optimization
  seed: 42
  frequency: W  # weekly (ISO week, Monday-aligned in VN2 data)

data:
  data_dir: data
  sales_file: Week8-2024-06-03-Sales.csv  # widest historical panel
  instock_file: Week0-InStock.csv
  master_file: Week0-Master.csv
  initial_state_file: Week0-2024-04-08-Initial State.csv
  initial_state_date: "2024-04-08"
  id_cols:
    - store
    - product
  date_col: date
  target_col: sales
  instock_col: in_stock

forecasting:
  forecaster_type: quantile   # "quantile" (uncertainty → RL sigma signal) or "mean" (point forecast)
  features:
    calendar:
      enabled: true
      cyclical_encoding: true
      fourier_harmonics: 3  # week-of-year sine/cosine pairs; 1 keeps the base names
    holidays:
      enabled: true
      events:
        - new_year
        - easter
        - halloween
        - black_friday
        - christmas
        - summer_peak
      weeks_until_max: 4
      weeks_since_max: 2
    lags:
      enabled: true
      momentum: true
      lags: [1, 2, 4, 8, 13, 51, 52, 53]  # 51–53 = same weeks last year; backward only
      rolling_windows: [4, 8, 13]
      rolling_aggs: [mean, std, min, max, median]
      expanding_aggs: [mean, std, min, max]
      expanding_min_periods: 4
    hierarchical:
      enabled: true
      group_levels:
        - [store, product_group]
        - [store, division]
        - [store, department]
        - [product_group]
      group_lags: [1, 2, 4, 8, 26, 52]
      group_rolling_windows: [4, 13]
      add_share_within_group: true

  validation:
    n_folds: 5
    fold_size_weeks: 13
    min_train_size_weeks: 52

  model:
    horizons: [0, 1, 2]
    quantiles: [0.1, 0.5, 0.9]
    lead_time_demand:
      enabled: true
      offsets: [0, 1, 2]   # S_t = sum of sales at t + offsets (protection period)
      quantiles: [0.5, 0.83, 0.9, 0.95]  # 0.83 = Cs/(Cs+Ch) critical ratio
    target_transform: log1p  # fit quantiles in log space (handles right-skew/spikes)
    sample_weight: null  # demand-weighting backfired with log1p (extrapolation blow-ups); off
    sigma_divisor: 2.56  # normal approx: (Q90 - Q10) / 2.56 ≈ sigma
    lightgbm:
      num_leaves: 31
      learning_rate: 0.05
      n_estimators: 500
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 20
      reg_alpha: 0.1
      reg_lambda: 0.1
      verbose: -1
    categorical_features:
      - store
      - product
      - product_group
      - division
      - department
      - department_group
      - store_format
      - format
      - week_of_year

  # M2 Air (8 cores): 4 fits at once × 2 threads each. Raise tuning.n_jobs only if n_jobs is 1.
  compute:
    n_jobs: 4
    booster_threads: 2

  model_selection:
    enabled: false
    candidates: [lightgbm, xgboost, catboost]
    n_candidates_to_tune: 1       # keep top-K after selection, tune all survivors
    elimination_threshold: 0.40   # drop models >40% worse than best on defaults

  tuning:
    enabled: false
    n_jobs: 1             # parallel Optuna trials (keep 1 while compute.n_jobs > 1)
    n_trials: 50
    n_cv_folds: 5         # most-recent folds used per Optuna trial (1 = fast)
    timeout_seconds: null # wall-clock cap in seconds (null = no cap)
    seed: 42
    n_trials_no_improve: 10      # stop if best hasn't improved for this many trials
    early_stopping_min_delta: 0.0001

  mlflow:
    experiment_name: vn2-demand-forecasting
    tracking_uri: sqlite:///mlruns.db
    skip_duplicate_runs: true

  artifacts:
    model_dir: artifacts/models
    forecasts_dir: artifacts/forecasts

periods:
  data_start: null
  end: null
  rl_test_weeks: 9
  rl_val_weeks: 8
  rl_train_weeks: 26
  refit_per_block: true

rl:
  forecast_run_id: null  # forecasting run whose periods + forecasts RL uses (null = latest on disk)
  environment:
    holding_cost: 0.2
    shortage_cost: 1.0
    lead_time_weeks: 2  # order placed at t arrives in full at t+lead_time_weeks
    max_order: 50.0           # default cap for a standalone env when no per-SKU cap given
    order_cap_mult: 1.0       # per-SKU cap = mult * that SKU's peak historical weekly sales
    min_order_cap: 1.0        # avoid a degenerate zero cap for never-sold SKUs
    normalize_action: true    # (ignored when residual_mode) action as fraction of cap
    scale_obs_by_cap: false    # on-hand, pipeline, and weekly quantiles in units of the SKU cap
    per_sku_reward_norm: false # OFF: equal-weighting de-prioritized high-volume SKUs (67% of cost) and hurt the real objective
    residual_mode: true      # direct RL: agent emits the order fraction itself (classic PPO/DQN)
    residual_floor_frac: 0.25 # min correction scale = frac * order_cap (used only when residual_mode)
    ltd_base_stock_quantile: 0.83  # order-up-to quantile of lead-time demand S_t

  agents:
    ppo:
      policy: MlpPolicy
      learning_rate: 0.0003
      n_steps: 2048
      batch_size: 64
      n_epochs: 10
      gamma: 0.99
      ent_coef: 0.05
      total_timesteps: 10000000  # longer run

    dqn:
      # 8-bucket set that produced the best DQN (-12.14); 17-bucket grids only regressed.
      # Fine at the low end to trim holding cost, broad higher up.
      order_buckets: [0.0, 0.02, 0.05, 0.1, 0.2, 0.35, 0.6, 1.0]
      # residual_mode: signed corrections on base-stock (fractions of the residual scale)
      residual_buckets: [-1.0, -0.5, -0.25, -0.1, -0.05, 0.0, 0.05, 0.1, 0.25, 0.5, 1.0]
      learning_rate: 0.0001
      buffer_size: 50000
      learning_starts: 1000
      batch_size: 64
      gamma: 0.99
      exploration_fraction: 0.4    # decay epsilon over 40% of training (was 0.1)
      exploration_final_eps: 0.10  # keep 10% random actions (was 0.05)
      total_timesteps: 1000000

  mlflow:
    experiment_name: vn2-inventory-rl
    tracking_uri: sqlite:///mlruns.db
